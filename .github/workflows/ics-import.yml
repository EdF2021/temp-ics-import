name: ics-import
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse ICS
        run: node parse-ics.js
      - name: Split JSON
        run: node -e "
const fs=require('fs');
const j=fs.readFileSync('surf-events.json','utf8');
const size=8000;
let i=0;
for(let off=0;off<j.length;off+=size){i++;
fs.writeFileSync('parts/part-'+String(i).padStart(2,'0')+'.json',j.slice(off,off+size));}
fs.writeFileSync('parts/count.txt',String(i));
"
      - name: Commit results
        run: |
          git config user.name "ics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add parts surf-events.json raw.ics
          git commit -m "parsed ics" || echo "nothing to commit"
          git push