name: ics-import
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse ICS
        run: node parse-ics.js
        env:
          ICS_URL: https://outlook.office365.com/owa/calendar/0f17d7dd19d54501bd794b502804a3c8@surf.nl/ef608d548b7f48228037c262897bf2029943935942078287197/calendar.ics
      - name: Commit results
        run: |
          git config user.name "ics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw.ics surf-events.json parts
          git commit -m "parsed ics" || echo "nothing to commit"
          git push